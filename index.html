<style>
  :root{--bg:#0e1114;--panel:#161b21;--panel2:#1d242c;--line:#2b333d;--ink:#e8edf2;--mute:#93a1b0;--accent:#5ec8f2}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #wrap{display:flex;height:100%;overflow:hidden}
  #side{width:430px;min-width:430px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #head{padding:16px 20px 13px;border-bottom:1px solid var(--line)}
  #head h1{margin:0;font-size:16px;line-height:1.3}
  #head p{margin:6px 0 0;font-size:11.5px;color:var(--mute);line-height:1.5}
  #ctl{padding:10px 20px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent);color:var(--accent)}
  #days{overflow-y:auto;flex:1;padding:10px 12px 40px}
  .day{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2);overflow:hidden}
  .dayhead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;user-select:none}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dayhead .t{font-size:13px;font-weight:600;flex:1;line-height:1.35}
  .day.shown{border-color:#5ec8f2}
  .dayhead .m{font-size:11px;color:var(--mute);white-space:nowrap;text-align:right}
  .body{display:none;padding:2px 13px 13px}
  .day.open .body{display:block}
  .stop{display:flex;gap:9px;padding:7px 0;border-top:1px solid #262e37}
  .num{flex:none;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0e1114}
  .num.ferry{background:#fff;color:#0e1114;border-radius:4px}
  .num.unplot{background:transparent;border:1.5px dashed #93a1b0;color:#93a1b0}
  .sc{flex:1;min-width:0}
  .sn{font-size:12.5px;font-weight:600;line-height:1.35}
  .sd{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:1px}
  .tw{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:2px}
  .tm.proj{color:#9fe0ff}
  .tmb{font:400 10px/1.3 -apple-system,sans-serif;color:#6f8090;white-space:nowrap}
  .fin{color:#9fe0ff;font-weight:600}
  button.on{border-color:#5ec8f2;color:#5ec8f2}
  .tm{flex:none;font:600 11.5px/1.4 -apple-system,sans-serif;color:#cfe6f4;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
  .tm.none{color:#4d5a66;font-weight:400}
  .provrow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .prov{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid;border-radius:4px;padding:2px 5px;white-space:nowrap}
  #legend{padding:9px 20px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--mute);line-height:1.7}
  #legend b{font-weight:700}
  .gm{display:inline-block;margin-top:0;font-size:10.5px;color:#5ec8f2;text-decoration:none;border-bottom:1px solid rgba(94,200,242,.35)}
  .gm:hover{color:#9fe0ff}
  .legln{font-size:10.5px;color:#6f8090;margin-top:3px;font-variant-numeric:tabular-nums}
  .late{margin-top:4px;font-size:10.5px;color:#ffb3b3;background:#3a1a1a;border:1px solid #6b2b2b;border-radius:5px;padding:4px 6px;line-height:1.45}
  .badlate{color:#ff9c9c;font-weight:600}
  .flag{margin-top:10px;padding:9px 10px;border-radius:7px;background:#33240f;border:1px solid #6b4a17;color:#f4d79a;font-size:11.5px;line-height:1.5}
  .note{margin-top:9px;padding:9px 10px;border-radius:7px;background:#0f2530;border:1px solid #1d4b5e;color:#b7e2f2;font-size:11.5px;line-height:1.5}
  #map{flex:1;position:relative}
  #zhint{position:absolute;z-index:500;bottom:14px;left:14px;background:rgba(22,27,33,.92);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--mute)}
  #foot{padding:11px 20px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute);line-height:1.6}
  #foot a{color:var(--accent)}
  .mpill{height:22px;padding:0 8px;border-radius:11px;border:2px solid #0e1114;display:flex;align-items:center;justify-content:center;font:700 11px/1 -apple-system,sans-serif;color:#0e1114;white-space:nowrap;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
  .mnum{border-radius:50%;white-space:nowrap;border:2px solid #0e1114;display:flex;align-items:center;justify-content:center;font:700 11px/1 -apple-system,sans-serif;color:#0e1114;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
  @media (max-width:860px){#wrap{flex-direction:column}#side{width:100%;min-width:0;height:55%;border-right:none;border-bottom:1px solid var(--line)}#map{height:45%}}
</style>
</head>

const DAYS = [
{
 id:"d1", color:"#5ec8f2", date:"Thu 6 Aug", title:"Arrival + South Shore → Umi Hotel (reordered)",
 roads:["d1"],
 stops:[
  ["KEF","Inbound flight lands 06:25. 50 min for immigration, bags and loading the group — roll at 07:15.",""],
  ["ALMAR","Rest stop at Almar Bakari, Sunnumörk 2. Open 07:00–18:00 daily, so no opening risk. 25 min.",""],
  ["HVOLS","Hvolsvöllur — held as a drive-through, 0 min. It sits 58 min after the bakery, so a second rest stop that soon is one too many for a group off a redeye. If you do stop, it comes out of the day\u2019s buffer.",""],
  ["SELJA","Seljalandsfoss. 35 min — enough to walk behind the falls and back.",""],
  ["REYNIS","Reynisfjara. Taken before Vík since the Route 215 turnoff comes first driving east. 35 min. Sneaker waves — brief them before they leave the coach.",""],
  ["VIK","Lunch in Vík. 50 min.",""],
  ["SKOGA","Skógafoss. Taken on the run in, 9.4 km short of the hotel instead of a 42 km backtrack. 40 min — base of the falls, not the 527 steps.",""],
  ["UMI","Projected arrival 14:54, against the \u201caround 4pm\u201d in the email. Overnight; driver and guide same hotel.",""]],
 flags:["REORDERED from the itinerary email. As the operator listed it — Skógafoss, Seljalandsfoss, Vík, Reynisfjara — the day runs 342 km / 5h22. This order is 288 km / 4h35: 54 km and 47 minutes saved. Two changes: Reynisfjara before Vík, because its Route 215 turnoff comes first driving east; and Skógafoss last, because the hotel sits between Seljalandsfoss and Skógafoss, turning a 42 km backtrack into a 9.4 km stop on the run in. Needs the operator to sign off."],
 notes:["Umi Hotel pin is field-verified (63.51859, -19.64097), which is what makes the reorder work — it sits between Seljalandsfoss and Skógafoss.","Tightened: 235 min on the ground against 275 min driving, so the hotel comes up at 14:55 rather than 16:00. That is an hour in hand on a day the group has come off an overnight from Washington. Allocation: 50 airport, 25 bakery, 35 Seljalandsfoss, 35 Reynisfjara, 50 lunch, 40 Skógafoss, Hvolsvöllur zero.","Almar Bakari opening hours verified at almarbakari.is: 07:00–18:00 daily, Sunnumörk 2, Hveragerði."]
},
{
 id:"d2", color:"#7ee081", date:"Fri 7 Aug", title:"Westman Islands (Vestmannaeyjar)",
 roads:["d2_a","d2_b","d2_c"], ferry:true,
 stops:[
  ["UMI","Departure from Umi Hotel at 08:50.",""],
  ["LANDEY","Drive to Landeyjahöfn. 36.4 km / ~34 min from the corrected hotel pin. Check-in closes 09:30 — 30 min before the 10:00 sailing per the ticket. Earliest arrival 09:24, so only 6 minutes of margin.",""],
  [null,"FERRY — Landeyjahöfn 10:00 → Heimaey 10:40. TICKETED: Herjólfur ferry booking, Ferð 1, paid. the group = the group, plus one coach, so the coach is on board.","ferry","Ferry — Landeyjahöfn → Heimaey"],
  ["HEIMAPORT","Arrive Heimaey 10:40. Herjólfur berth at Básaskersbryggja.",""],
  ["HERJDAL","Herjólfsdalur — the settlement valley and the reconstructed Herjólfur farm (OSM: Herjólfstown). 1.9 km / ~4 min from the berth.",""],
  ["THJOD","Þjóðhátíð Amphitheatre — the natural bowl the festival is staged in, 200 m from the farm. Coordinate from Google Maps; not in OpenStreetMap.",""],
  ["KAPLA","Kaplagjóta — a long cleft running east, south of Dalfjall and parallel with Herjólfsdalur (Heimaslóð). Position is your own dropped pin, 63.43989, -20.30516. Sits 285 m from Elephant Rock and 466 m from the farm. Nearest road point is 379 m away, so it is a walk. Horses were thrown in to cull them: the 1528 Vilborgarstaðaþing capped Heimaey at 16 horses, and surplus or worn-out animals went over the edge. Above it on Dalfjall\u2019s south-east face are the grassy ledges Tíkartær, said to be haunted by a boy sent unwillingly to the puffin cliffs who fell to his death.",""],
  ["ELEPHANT","Halldórsskora (Elephant Rock). Coordinate from Google Maps. NOT drive-up — nearest road point is the Herjólfsdalur road head, 641 m away straight-line, and that line crosses the Dalfjall/Blátindur ridge. Shown as a dashed spur. Often viewed from a boat instead; confirm the approach with the operator.",""],
  ["STORHOFDI","Puffins at Stórhöfði cape.",""],
  ["ELDFELL","Mt. Eldfell. Road reaches 357 m from the OSM summit point — the rest is on foot up the scoria.",""],
  ["NAES","Lunch — næs, Strandvegur 79. Your pin. The itinerary email only said \u201cbreak for lunch in Vestmannaeyjabær\u201d with no venue, so this is yours, not the operator\u2019s. 3.3 km / ~6 min down from Eldfell, then 1.6 km / ~3 min on to Eldheimar.",""],
  ["ELDHEIMAR","Eldheimar museum — booked 15:00 under the group name.",""],
  ["HEIMAPORT","Back at the berth. Ticket is the 18:00, so check-in closes 17:30.",""],
  [null,"FERRY — 18:00 → Landeyjahöfn 18:40. TICKETED: ferry booking, Ferð 2, paid. Same the group + a 14 m coach. The itinerary email said 17:00; the ticket says 18:00. Ticket wins.","ferry","Ferry — Heimaey → Landeyjahöfn"],
  ["LANDEY","Arrive Landeyjahöfn 18:40.",""],
  ["UMI","Arrive Umi Hotel about 19:20 — roughly 50 min later than the ~18:30 in the email, because the ticket is the 18:00 sailing. Driver and guide same hotel.",""]],
 flags:["The itinerary email says a 17:00 return. The paid ticket (Herjólfur ferry booking, sent by the operator 5 Aug) is the 18:00. Plan on 18:00 — harbour by 17:30, Umi ~19:20, roughly 50 min later than the email's ~18:30. Worth telling the hotel.","Outbound check-in closes 09:30 for the 10:00. With the corrected hotel pin, leaving at 08:50 gets you there 09:24 — 6 minutes of margin with the group and a 14 m coach to load. Leave at 08:30.","Þorlákshöfn diversion. Herjólfur\'s FAQ covers what happens if it cannot sail to Landeyjahöfn. Nothing on the 7 Aug booking indicates one, but know the fallback."],
  notes:["Island driving with all stops in: 23.1 km / ~37 min total.","Ferry legs are drawn as white dashed straight lines — that is a sea crossing, not a road.","Times and crossing duration verified against the Herjólfur booking site for 7 Aug 2026 (40 min crossing, check-in 30 min before, boarding closes 5 min before).","Still outstanding: a pin for Diamond Beach and for the Greenhouse Hotel food hall in Hveragerði — the link you sent for both resolved to the Jökulsárlón boat operator instead. Fagradalsfjall trailhead still open.","Kaplagjóta is in neither OpenStreetMap nor Google Maps. It is now your dropped pin. My earlier photogrammetric trace was 277 m off, so the ±50 m confidence I quoted was overstated.","Naming: there is no Herjólfsstaðir on Heimaey — that name belongs to a farm in Álftaver on the mainland (63.5250, -18.4223) and another in Skagafjörður. On the island it is Herjólfsdalur, with the reconstructed farm mapped as Herjólfstown / Herjólfsbær. Pin is the farm itself at 63.44209, -20.29716."]
},
{
 id:"d3", color:"#f2a65e", date:"Sat 8 Aug", title:"Umi → Fjallsárlón / Jökulsárlón → Hotel Jökulsárlón",
 roads:["d3"],
 stops:[
  ["UMI","Leave at 08:30, not the 09:00 in the email. Umi to Frost direct is 225 km / 3h12 — from 09:00 with a 20 min WC stop you are 3 minutes late for the 12:30 lunch. 08:30 buys you 27 minutes.",""],
  ["KLAUSTUR","WC and coffee, 30 min. 113 km / 1h38 from the hotel, so this is the natural first break.",""],

  ["DIAMOND","Diamond Beach, 55 min. Given a generous allocation deliberately — it soaks up what would otherwise be a dead wait at the lagoon before the boat.",""],
  ["JOKULS","Amphibian boat — 15:10 (25 pax) and 15:20 (7 pax), a booking. Arrive 14:39, so 31 min in hand to get two departures checked in. 75 min allowed for check-in and the tour.",""],
  ["HJOKULS","Arrive Hotel Jökulsárlón after the boat tour. Driver and guide same hotel.",""]],

{
 id:"d4", color:"#e07ec8", date:"Sun 9 Aug", title:"Hotel Jökulsárlón → Hveragerði → Hotel Geysir",
 roads:["d4","d4_x"],
 stops:[
  ["HJOKULS","Leave at 08:00, not the 09:00 in the email. As written this day is 422 km / 6h11 of driving in a 09:00\u201316:00 window. The hour is the only thing that makes it deliverable.",""],
  ["FJADRAR","Fjaðrárgljúfur gorge hike. 141 km / 2h02 from the hotel. 60 min.",""],

},
{
 id:"d5", color:"#c8a2f2", date:"Mon 10 Aug", title:"Golden Circle loop from Hotel Geysir",
 roads:["d5_x","d5","d5_y"],

 flags:["ORDER CONFIRMED AS THE EMAIL HAS IT. Tested all 120 possible sequences with the loop pinned to start and finish at Hotel Geysir: Þingvellir, Kerið, Friðheimar, Gullfoss, Geysir is rank 1 of 120 at 155.4 km / 2h30. Nothing beats it. There is no wasted driving to cut here.","Running it in reverse looks shorter only if you ignore the drop-off. The group sleeps at Hotel Geysir and departs from there at 09:00 on the 11th, so the loop has to come back — and once it does, the reverse saves nothing.","The two empty positioning legs are the real cost of this day: 115 km out from BSÍ before pickup and 106 km back after drop-off. That is unavoidable with the bus based in Reykjavík and the group based at Geysir."],

},

 roads:["d7","d7_b"],
 stops:[
  ["STOP6","Departure from Bus Stop 6 at 09:30.",""],
  ["SELTUN","Seltún geothermal area 10:15–10:40. 35 km / ~40 min from Stop 6.",""],
  ["FAGRA","Fagradalsfjall hike 11:00–13:00. Marker is the mountain itself — no trailhead or car park is named in the email, so the connector is dashed, not a road route.",""],
  ["PAPAS","Lunch 13:15–14:15 at Papa's, Grindavík. Fish, fries and soda pre-booked by the operator.",""],
  ["GRIND","Drive around Grindavík 14:15–15:00.",""],
  ["SKY","Sky Lagoon — Sér admission booked 16:30.",""],
  ["STOP6","18:30 departure to Bus Stop 6.",""]],
 flags:["No Fagradalsfjall trailhead specified, and access has repeatedly changed with eruption activity and closures. Get the exact car park and current access status from the operator, and check it again on the morning.","Grindavík access is subject to civil-protection closures. Verify on the day before committing to the lunch and the town drive."],
 notes:["Timings on this day are the only ones in the week that actually hold up: 09:30 → 10:15 for a 40 min drive, and 15:00 → 16:30 for a 50 min drive."]
}
];


// ---------- schedule engine ----------
const LEG = {};
Object.values(D.routes).forEach(r => r.legs.forEach(l => { LEG[l.from+">"+l.to] = l; }));

function toMin(t){ if(!t) return null; const m=/(\d{1,2}):(\d{2})/.exec(t); return m? (+m[1])*60 + (+m[2]) : null; }
function gmap(la,lo){ return `https://www.google.com/maps/search/?api=1&query=${la.toFixed(6)},${lo.toFixed(6)}`; }
function toHHMM(m){ m=Math.round(m); const h=Math.floor(m/60)%24; return String(h).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }

// Two clocks:
//   "booked"    = the times the operator stated, plus earliest-possible arrival from drive time only
//   "realistic" = projected clock from the day's first booked time, adding drive AND time on the ground
let MODE = "booked";

function schedule(d){
  const sch = SCHED[d.id]||{}, end = SCHED_END[d.id]||{}, dw = DWELL[d.id]||{};
  const rows = d.stops.map((s,i)=>({ n:i+1, key:s[0], desc:s[1], kind:s[2],
      stated:sch[i+1]||"", statedEnd:end[i+1]||"", label:s[3]||"", dwell: dw[i+1]==null?0:dw[i+1] }));

  // drive minutes into each stop
  let prevKey=null;
  rows.forEach(r=>{
    if(r.key && prevKey){ const l = LEG[prevKey+">"+r.key]; r.leg = l ? {km:l.km,min:l.min} : null; }
    if(r.key) prevKey = r.key;
  });

  // ---- booked clock: earliest arrival from drive alone, chain broken by unknown gaps
  let anchor=null, accum=0;
  rows.forEach(r=>{
    if(r.kind==="ferry" && !r.stated){ anchor=null; accum=0; r.unknownGap=true; }
    if(r.leg) accum += r.leg.min;
    const st = toMin(r.stated);
    if(anchor!==null) r.earliest = anchor + accum;
    if(st!==null){
      if(r.earliest!=null && r.earliest > st+1) r.late = r.earliest - st;
      anchor = toMin(r.statedEnd)!==null ? toMin(r.statedEnd) : st;
      accum = 0;
    } else if(toMin(r.statedEnd)!==null){ anchor = toMin(r.statedEnd); accum = 0; }
  });

  // ---- realistic clock: never breaks, uses assumed crossing + dwell everywhere
  const first = rows.find(r=>toMin(r.stated)!==null);
  if(first){
    let t = toMin(first.stated);
    let started = false;
    rows.forEach(r=>{
      if(r === first){ started = true; r.proj = t; }
      else if(started){
        if(r.kind==="ferry" && !r.stated) r.projNote = CROSSING_NOTE;
        t += (r.leg ? r.leg.min : 0);
        r.proj = t;
        const st = toMin(r.stated);
        if(st!==null && t < st){ r.wait = st - t; t = st; r.proj = st; }  // cannot enter a booking early
        if(st!==null && t > st+1) r.slip = t - st;
      }
      if(started) t += r.dwell;
      if(started && toMin(r.statedEnd)!==null && t < toMin(r.statedEnd)) t = toMin(r.statedEnd);
    });
  }
  return rows;
}

const map = L.map("map").setView([64.1,-19.6],7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);

const FERRY_OUT = [[D.points.LANDEY.lat,D.points.LANDEY.lon],[D.points.HEIMAPORT.lat,D.points.HEIMAPORT.lon]];
const layers = {}, labels = {}, marks = {};

function pillIcon(color, txt){
  const w = 16 + txt.length*7.2;
  return L.divIcon({className:"", iconSize:[w,22], iconAnchor:[w/2,11],
    html:`<div class="mpill" style="background:${color}">${txt}</div>`});
}
function numIcon(color, txt, size){
  const s = size||24;
  return L.divIcon({className:"", iconSize:[s,s], iconAnchor:[s/2,s/2],
    html:`<div class="mnum" style="width:${s}px;height:${s}px;background:${color}">${txt}</div>`});
}

DAYS.forEach(d=>{
  const g = L.featureGroup(), lab = L.layerGroup();
  d.roads.forEach(k=>L.polyline(D.routes[k].geometry,{color:d.color,weight:4,opacity:.85}).addTo(g));

  if(d.ferry){
    L.polyline(FERRY_OUT,{color:"#ffffff",weight:3,opacity:.95,dashArray:"8,9"}).addTo(g)
      .bindPopup("<b>Ferry</b><br>Landeyjahöfn ⇄ Heimaey<br>Outbound sailing time not stated in the itinerary; return stated as 17:00.");
  }
  if(d.id==="d2" && D.spurs){
    Object.values(D.spurs).forEach(sp=>{
      L.polyline([sp.road, sp.point],{color:"#ffffff",weight:2,opacity:.75,dashArray:"3,6"}).addTo(g)
        .bindPopup(`<b>On foot</b><br>~${sp.walk_m} m from the nearest road point`);
    });
  }
  if(d.id==="d7"){
    L.polyline([[D.points.SELTUN.lat,D.points.SELTUN.lon],[D.points.FAGRA.lat,D.points.FAGRA.lon],[D.points.PAPAS.lat,D.points.PAPAS.lon]],
      {color:d.color,weight:3,opacity:.8,dashArray:"5,8"}).addTo(g);
  }

  // markers live in their own layer, rebuilt on zoom so overlapping stops collapse into one pin
  d._mk = L.layerGroup();
  d._plotted = d.stops.map((s,i)=>({n:i+1, key:s[0], desc:s[1]})).filter(o=>o.key);
  d._refreshTimes = ()=>{
    const sc = schedule(d);
    d._plotted.forEach(o=>{
      const r = sc[o.n-1];
      o.time = MODE==="booked"
        ? (r.stated ? r.stated + (r.statedEnd?"–"+r.statedEnd:"") : (r.earliest!=null?"≈ "+toHHMM(r.earliest):""))
        : (r.proj!=null ? toHHMM(r.proj) + (r.stated?"  (booked "+r.stated+")":"") : "");
      o.short = MODE==="booked" ? (r.stated||"") : (r.proj!=null?toHHMM(r.proj):"");
    });
  };

  const seenLabel = new Set();
  d._labelSpec = [];
  d._plotted.forEach(o=>{
    if(seenLabel.has(o.key)) return; seenLabel.add(o.key);
    d._labelSpec.push(o);
  });
  d._buildLabels = ()=>{
    lab.clearLayers();
    d._labelSpec.forEach(o=>{
      const p = D.points[o.key];
      const t = o.short ? `<span style="color:${d.color}">${o.short}</span>  ` : "";
      L.marker([p.lat,p.lon],{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],
        html:`<div style="font:600 11px/1 -apple-system,sans-serif;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000,0 0 3px #000;white-space:nowrap;transform:translate(16px,-4px)">${t}${p.name}</div>`})}).addTo(lab);
    });
  };

  layers[d.id]=g; labels[d.id]=lab; marks[d.id]=d._mk;
});

const LABEL_ZOOM = 12;
function syncLabels(){
  DAYS.forEach(d=>{
    const on = map.hasLayer(layers[d.id]) && map.getZoom() >= LABEL_ZOOM;
    if(on && !map.hasLayer(labels[d.id])) labels[d.id].addTo(map);
    if(!on && map.hasLayer(labels[d.id])) map.removeLayer(labels[d.id]);
  });
  document.getElementById("zhint").style.display = map.getZoom() >= LABEL_ZOOM ? "none" : "block";
}
map.on("zoomend", syncLabels);
function frameSelection(){
  const on = DAYS.filter(d=>map.hasLayer(layers[d.id])).map(d=>layers[d.id]);
  if(!on.length){ map.setView([64.1,-19.6],7); return; }
  map.fitBounds(L.featureGroup(on).getBounds().pad(.10));
}
function rebuildMarkers(){
  DAYS.forEach(d=>{
    if(d._refreshTimes) d._refreshTimes();
    if(d._buildLabels) d._buildLabels();
    if(!d._mk) return;
    const on = map.hasLayer(layers[d.id]);
    if(!on){ if(map.hasLayer(d._mk)) map.removeLayer(d._mk); d._mk.clearLayers(); return; }
    if(!map.hasLayer(d._mk)) d._mk.addTo(map);
    d._mk.clearLayers();
    const placed = [];
    d._plotted.forEach(o=>{
      const p = D.points[o.key];
      const pt = map.latLngToLayerPoint([p.lat,p.lon]);
      const hit = placed.find(q => pt.distanceTo(q.pt) < 26);
      if(hit){ hit.ns.push(o.n); hit.items.push(o); }
      else { placed.push({pt:pt, ll:[p.lat,p.lon], ns:[o.n], items:[o]}); }
    });
    placed.forEach(gr=>{
      const single = gr.ns.length === 1;
      const sorted = gr.ns.slice().sort((a,b)=>a-b);
      const contiguous = sorted.length === sorted[sorted.length-1] - sorted[0] + 1;
      const txt = single ? String(sorted[0])
                : (contiguous ? sorted[0]+"–"+sorted[sorted.length-1] : sorted.join(" · "));
      const html = gr.items.map(o=>{
        const pp = D.points[o.key];
        const t = o.time ? `<div style="font-weight:700;color:#0b5f86">${o.time}</div>` : "";
        const pv = PROVLBL[PROV[o.key]||"bad"];
        return `${t}<b>Stop ${o.n} — ${pp.name}</b><br>${o.desc}`
             + `<br><b style="color:#0b5f86">Source: ${pv[0]}</b>`
             + `<br><span style="color:#8a97a5">${pp.lat.toFixed(5)}, ${pp.lon.toFixed(5)}</span>`
             + `<br><a target="_blank" rel="noopener" href="${gmap(pp.lat,pp.lon)}">Open in Google Maps ↗</a>`;
      }).join("<hr style='border:none;border-top:1px solid #ddd;margin:6px 0'>");
      L.marker(gr.ll,{icon: single ? numIcon(d.color, txt) : pillIcon(d.color, txt), zIndexOffset: single?0:400}).addTo(d._mk)
        .bindPopup(html + (single ? "" : "<br><span style=\'color:#8a97a5\'>Zoom in to separate these stops</span>"));
    });
  });
}
map.on("zoomend", rebuildMarkers);


// ---- sidebar
const list = document.getElementById("days");
function renderSidebar(openIds){
  list.innerHTML = "";
  openIds = openIds || new Set();
DAYS.forEach(d=>{
  const km = d.roads.reduce((a,k)=>a+D.routes[k].distance_km,0);
  const mn = d.roads.reduce((a,k)=>a+D.routes[k].duration_min,0);
  const el = document.createElement("div"); el.className="day"; el.dataset.id = d.id;
  const sched = schedule(d);
  const rows = sched.map(r=>{
    const cls = r.kind==="ferry" ? "num ferry" : (r.kind==="unplotted" ? "num unplot" : "num");
    const bg  = r.kind==="" ? `background:${d.color}` : "";
    const nm  = r.key ? D.points[r.key].name : (r.label || (r.kind==="ferry" ? "Ferry crossing" : "Stop"));

    const booked = r.stated ? `${r.stated}${r.statedEnd?"–"+r.statedEnd:""}` : "";
    let clock, sub = "";
    if(MODE === "booked"){
      clock = booked ? `<span class="tm">${booked}</span>` : `<span class="tm none">—</span>`;
      if(r.unknownGap) sub = `<div class="legln" style="color:#f4d79a">crossing time unknown — clock estimates stop here</div>`;
      else if(r.late)  sub = `<div class="late">${r.late} min late — earliest arrival ${toHHMM(r.earliest)} vs booked ${r.stated}</div>`;
      else if(r.earliest!=null && !r.stated) sub = `<div class="legln">earliest here ≈ ${toHHMM(r.earliest)}</div>`;
    } else {
      clock = r.proj!=null
        ? `<span class="tm proj">${toHHMM(r.proj)}</span>${booked?`<span class="tmb">booked ${booked}</span>`:""}`
        : `<span class="tm none">—</span>`;
      if(r.projNote) sub += `<div class="legln" style="color:#f4d79a">${r.projNote}</div>`;
      if(r.dwell)    sub += `<div class="legln">${r.dwell} min on the ground</div>`;
      if(r.wait)     sub += `<div class="legln" style="color:#9fdcae">${r.wait} min spare before the booking</div>`;
      if(r.slip)     sub += `<div class="late">${r.slip} min past the booked ${r.stated}</div>`;
    }

    let badge = "";
    if(r.key){
      const t = PROV[r.key] || "bad", L = PROVLBL[t];
      badge = `<span class="prov" style="color:${L[1]};border-color:${L[1]}44" title="${L[2]}">${L[0]}</span>`;
    }
    const gm = r.key ? `<a class="gm" target="_blank" rel="noopener" href="${gmap(D.points[r.key].lat, D.points[r.key].lon)}">Open in Google Maps ↗</a>` : "";
    const leg = r.leg ? `<div class="legln">↓ ${r.leg.km} km · ${r.leg.min} min drive</div>` : "";
    return `${leg}<div class="stop"><div class="${cls}" style="${bg}">${r.n}</div>
      <div class="sc"><div class="sn">${nm}</div><div class="sd">${r.desc}</div>${sub}<div class="provrow">${badge}${gm}</div></div>
      <div class="tw">${clock}</div></div>`;
  }).join("");
  const lateTotal = sched.filter(r => MODE==="booked" ? r.late : r.slip).length;
  const endProj = sched.filter(r=>r.proj!=null).slice(-1)[0];
  el.innerHTML = `
   <div class="dayhead"><span class="dot" style="background:${d.color}"></span>
     <span class="t">${d.date} — ${d.title}</span>
     <span class="m">${d.stops.length} stops<br>${Math.round(km)} km · ${Math.floor(mn/60)}h${String(mn%60).padStart(2,"0")}${lateTotal?`<br><span class="badlate">${lateTotal} timing clash${lateTotal>1?"es":""}</span>`:""}${MODE==="realistic"&&endProj?`<br><span class="fin">ends ≈ ${toHHMM(endProj.proj)}</span>`:""}</span></div>
   <div class="body">${rows}
     ${(d.flags||[]).map(f=>`<div class="flag"><b>Check this:</b> ${f}</div>`).join("")}
     ${(d.notes||[]).map(n=>`<div class="note">${n}</div>`).join("")}</div>`;
  el.querySelector(".dayhead").onclick=()=>{
    const open = el.classList.toggle("open");
    el.classList.toggle('shown', open);
    if(open){ layers[d.id].addTo(map); }
    else { map.removeLayer(layers[d.id]); map.removeLayer(labels[d.id]); if(map.hasLayer(marks[d.id])) map.removeLayer(marks[d.id]); }
    frameSelection(); syncLabels(); rebuildMarkers();
  };
  if(openIds.has(d.id)) el.classList.add("open");
  list.appendChild(el);
});
}
renderSidebar();

document.getElementById("all").onclick=()=>{
  DAYS.forEach(d=>layers[d.id].addTo(map));
  document.querySelectorAll(".day").forEach(e=>{e.classList.add("open");e.classList.add("shown");});
  frameSelection(); syncLabels(); rebuildMarkers();
};
document.getElementById("none").onclick=()=>{
  DAYS.forEach(d=>{map.removeLayer(layers[d.id]);map.removeLayer(labels[d.id]);if(map.hasLayer(marks[d.id]))map.removeLayer(marks[d.id]);});
  document.querySelectorAll(".day").forEach(e=>{e.classList.remove("open");e.classList.remove("shown");});
  frameSelection(); syncLabels(); rebuildMarkers();
};
document.getElementById("fit").onclick=()=>map.setView([64.1,-19.6],7);

document.getElementById("mode").onclick=()=>{
  MODE = MODE==="booked" ? "realistic" : "booked";
  document.getElementById("mode").textContent =
    MODE==="booked" ? "Clock: booked times" : "Clock: realistic (with stop time)";
  document.getElementById("mode").classList.toggle("on", MODE==="realistic");
  const openIds = new Set([...document.querySelectorAll(".day.open")].map(e=>e.dataset.id));
  renderSidebar(openIds);
  rebuildMarkers();
};

(function initialView(){
  map.setView([64.1,-19.6],7);
  syncLabels(); rebuildMarkers();
})();   // open the Westman Islands day first
</script>
</body>
</html>
